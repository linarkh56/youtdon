<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self';script-src 'self' 'unsafe-inline' https://www.youtube.com;frame-src https://www.youtube.com;style-src 'self' 'unsafe-inline'">
<style>html,body,#player{width:100%;height:100%;margin:0;background:#000;overflow:hidden}#status{position:fixed;z-index:2;left:12px;bottom:12px;color:#fff;font:14px system-ui;text-shadow:0 1px 3px #000}</style>
<script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>
<div id="player"></div><div id="status"></div>
<script>
let yt=null,current=null,token='',reported='';
const status=document.querySelector('#status');
async function report(reason){if(!current||reported===current)return;reported=current;status.textContent=reason;try{await fetch('/api/playback/error',{method:'POST',headers:{'content-type':'application/json','x-youtdon-token':token},body:JSON.stringify({reason})})}catch{}}
function onYouTubeIframeAPIReady(){poll()}
function poll(){
  fetch('/api/playback').then(r=>r.json()).then(s=>{
    status.textContent=s.status==='playing'?`${Math.ceil(s.remainingSeconds)} сек.`:s.status==='error'?(s.error||'Ошибка воспроизведения'):'';
    if(s.videoId!==current){
      current=s.videoId;reported='';
      if(yt)yt.destroy();
      if(current)yt=new YT.Player('player',{videoId:current,playerVars:{autoplay:1,rel:0,playsinline:1},events:{onError:e=>report(`YouTube: ошибка ${e.data}`),onStateChange:e=>{if(e.data===YT.PlayerState.ENDED)status.textContent='Завершение ролика'}}});
    }
  }).catch(()=>status.textContent='Нет связи с backend');
  setTimeout(poll,500);
}
window.youtdon.token().then(t=>{token=t;poll()}).catch(()=>status.textContent='Ошибка авторизации');
</script>
</body>
</html>
