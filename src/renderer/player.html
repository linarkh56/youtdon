<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self';script-src 'self' https://www.youtube.com;frame-src https://www.youtube.com;style-src 'self' 'unsafe-inline'"><style>html,body,#player{width:100%;height:100%;margin:0;background:#000;overflow:hidden}#status{position:fixed;z-index:2;left:12px;bottom:12px;color:#fff;font:14px system-ui;text-shadow:0 1px 3px #000}</style><script src="https://www.youtube.com/iframe_api"></script></head><body><div id="player"></div><div id="status"></div><script>let yt=null,current=null;function onYouTubeIframeAPIReady(){poll()}function poll(){fetch('/api/playback').then(r=>r.json()).then(s=>{document.querySelector('#status').textContent=s.status==='playing'?`${Math.ceil(s.remainingSeconds)} сек.`:'';if(s.videoId!==current){current=s.videoId;if(yt)yt.destroy();if(current)yt=new YT.Player('player',{videoId:current,playerVars:{autoplay:1,rel:0,playsinline:1}})}}).catch(()=>{});setTimeout(poll,500)}poll()</script></body></html>
