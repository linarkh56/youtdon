<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self';script-src 'self' 'unsafe-inline';style-src 'self' 'unsafe-inline'"><style>html,body{margin:0;background:transparent;color:white;font:700 28px system-ui;text-shadow:0 2px 4px #000}#state{padding:16px}</style></head><body><div id="state"></div><script>const el=document.querySelector('#state');function draw(s){el.textContent=s.status==='idle'?'':`${s.videoId||''} · ${Math.ceil(s.remainingSeconds)} сек.`}function connect(){const p=location.protocol==='https:'?'wss':'ws';const ws=new WebSocket(`${p}://${location.host}/overlay/ws`);ws.onmessage=e=>draw(JSON.parse(e.data));ws.onclose=()=>setTimeout(connect,1000)}connect()</script></body></html>
