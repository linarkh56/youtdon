<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self';style-src 'self' 'unsafe-inline';script-src 'self'"><title>YouTube Donation Player</title><style>body{font:15px system-ui;margin:0;background:#111827;color:#f3f4f6}header{padding:20px 28px;background:#1f2937}main{padding:28px;max-width:1000px;margin:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#1f2937;border-radius:8px;padding:18px}button{background:#ef4444;color:#fff;border:0;padding:10px 14px;border-radius:6px;cursor:pointer}input{padding:10px;width:100%;box-sizing:border-box;margin:6px 0 12px}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #374151;text-align:left}.muted{color:#9ca3af}</style></head><body><header><strong>YouTube Donation Player</strong><span class="muted"> · тестовый режим</span></header><main><div class="grid"><section class="card"><h2>Тестовый донат</h2><label>Сумма, RUB<input id="amount" type="number" value="100" min="1"></label><label>Сообщение со ссылкой<input id="message" value="https://youtu.be/dQw4w9WgXcQ"></label><button id="send">Добавить в очередь</button><p id="status" class="muted"></p></section><section class="card"><h2>Интеграции</h2><p>DonationAlerts: <b>требуется OAuth-приложение</b></p><p>DonatePay: <b>требуется API-ключ</b></p><p class="muted">Внешние credentials не хранятся в renderer.</p></section></div><section class="card" style="margin-top:18px"><h2>Очередь</h2><table><thead><tr><th>Статус</th><th>Видео</th><th>Время</th><th>Провайдер</th></tr></thead><tbody id="orders"></tbody></table></section></main><script src="renderer.js"></script></body></html>
